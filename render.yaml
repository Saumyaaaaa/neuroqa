services:
  - type: web
    name: neuroqa-api
    runtime: python
    buildCommand: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt && python scripts/export_model.py
    startCommand: uvicorn neuroqa.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: src
    plan: free
